name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install checked Jujutsu toolchain
        run: |
          PYTHONPATH=src python -m hermes_helmet.jj_toolchain --bin-dir "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify Jujutsu version
        run: PYTHONPATH=src python -m hermes_helmet.jj_toolchain --check-binary "$(command -v jj)"
      - name: Run product and supply-chain verification
        run: scripts/verify.sh
      - name: Run minimum quickstart and setup profiles
        run: scripts/ci-product-proof.sh

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Render minimum Compose configuration
        run: docker compose -f deploy/compose.yaml config --quiet
        env:
          HERMES_GITHUB_TOKEN: synthetic-ci-token

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Confirm source scan checkout matches recorded source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Scan source, dependencies, and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
      - name: Generate source SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: spdx-json
          output: source-sbom.spdx.json
          hide-progress: true
      - name: Upload source SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-sbom
          path: source-sbom.spdx.json
          if-no-files-found: error

  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, security]
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Confirm packaging checkout matches recorded source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Download source SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-sbom
          path: .
      - name: Package CLI and bundled skills
        env:
          HERMES_HELMET_SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
        run: scripts/package-release-candidate.sh
      - name: Prove packaged setup, doctor, status, and profiles
        run: scripts/prove-packaged-release.sh
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-package
          path: |
            dist/rc/*.whl
            dist/rc/*.tar.gz
            dist/rc/SHA256SUMS
            dist/rc/CHANGELOG.md
            dist/rc/LICENSE
            dist/rc/NOTICE
            dist/rc/source-sbom.spdx.json
          if-no-files-found: error

  dev-image:
    if: vars.ENABLE_PRIVATE_IMAGE_PUBLISH == 'true' && github.event.repository.private && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [verify, compose, security, release-candidate]
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      HERMES_BASE_IMAGE: nousresearch/hermes-agent:v2026.9.14@sha256:99641e57ec762c59e54cb44aa6746b7fc68c18b3c5ddb088af54234c613d9294
      HERMES_BASE_AMD64_IMAGE: nousresearch/hermes-agent@sha256:1f983df4d778d46b3c3892d7598c9d57291430a6e35936ebc371ae1e5766699a
      HERMES_BASE_ARM64_IMAGE: nousresearch/hermes-agent@sha256:011f2e232f119a9601cf6525f7542921d758703c7771ce2f7b639a07fa8640d1
    steps:
      - name: Prepare runner disk for multi-platform image scans
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          df -h /
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build linux/amd64 image for pre-publish scan
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: hermes-helmet:scan-amd64
          build-args: |
            HERMES_HELMET_SOURCE_COMMIT=${{ env.SOURCE_COMMIT }}
            HERMES_HELMET_VERSION=0.1.0rc1
          cache-to: type=gha,scope=scan-amd64,mode=max
      - name: Pull exact linux/amd64 base for differential scan
        run: |
          mkdir -p dist/trivy
          docker pull "$HERMES_BASE_AMD64_IMAGE"
          docker tag "$HERMES_BASE_AMD64_IMAGE" hermes-base:scan-amd64
      - name: Scan linux/amd64 base image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: hermes-base:scan-amd64
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: json
          output: dist/trivy/base-amd64.json
          exit-code: "0"
          cache-dir: ${{ github.workspace }}/.cache/trivy
          hide-progress: true
      - name: Record Trivy database snapshot
        run: |
          test -s .cache/trivy/db/trivy.db
          test -s .cache/trivy/db/metadata.json
          sha256sum .cache/trivy/db/trivy.db > dist/trivy/trivy-db.sha256
          cp .cache/trivy/db/metadata.json dist/trivy/trivy-db-metadata.json
          if [ -s .cache/trivy/java-db/trivy-java.db ]; then
            sha256sum .cache/trivy/java-db/trivy-java.db > dist/trivy/trivy-java-db.sha256
            cp .cache/trivy/java-db/metadata.json dist/trivy/trivy-java-db-metadata.json
          else
            printf 'absent\n' > dist/trivy/trivy-java-db.sha256
          fi
      - name: Scan linux/amd64 image before publication
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: false
          scan-type: image
          image-ref: hermes-helmet:scan-amd64
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: json
          output: dist/trivy/derived-amd64.json
          exit-code: "0"
          cache-dir: ${{ github.workspace }}/.cache/trivy
          hide-progress: true
      - name: Verify unchanged Trivy database after linux/amd64 scans
        run: |
          sha256sum --check dist/trivy/trivy-db.sha256
          if grep -qx absent dist/trivy/trivy-java-db.sha256; then
            test ! -e .cache/trivy/java-db/trivy-java.db
          else
            sha256sum --check dist/trivy/trivy-java-db.sha256
          fi
      - name: Enforce clean linux/amd64 wrapper delta
        run: |
          python scripts/compare_trivy_reports.py \
            --base dist/trivy/base-amd64.json \
            --derived dist/trivy/derived-amd64.json \
            --platform linux/amd64 \
            --expected-base-ref "$HERMES_BASE_IMAGE" \
            --database-sha256-file dist/trivy/trivy-db.sha256 \
            --java-database-sha256-file dist/trivy/trivy-java-db.sha256 \
            --output dist/trivy/delta-amd64.json
      - name: Release linux/amd64 scan layers
        if: always()
        run: |
          rm -f dist/trivy/base-amd64.json dist/trivy/derived-amd64.json
          docker image rm -f hermes-helmet:scan-amd64 || true
          docker image rm -f hermes-base:scan-amd64 || true
          docker buildx prune --all --force || true
      - name: Build linux/arm64 image for pre-publish scan
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          load: true
          tags: hermes-helmet:scan-arm64
          build-args: |
            HERMES_HELMET_SOURCE_COMMIT=${{ env.SOURCE_COMMIT }}
            HERMES_HELMET_VERSION=0.1.0rc1
          cache-to: type=gha,scope=scan-arm64,mode=max
      - name: Pull exact linux/arm64 base for differential scan
        run: |
          docker pull "$HERMES_BASE_ARM64_IMAGE"
          docker tag "$HERMES_BASE_ARM64_IMAGE" hermes-base:scan-arm64
      - name: Scan linux/arm64 base image
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: false
          scan-type: image
          image-ref: hermes-base:scan-arm64
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: json
          output: dist/trivy/base-arm64.json
          exit-code: "0"
          cache-dir: ${{ github.workspace }}/.cache/trivy
          hide-progress: true
      - name: Verify unchanged Trivy database after linux/arm64 base scan
        run: |
          sha256sum --check dist/trivy/trivy-db.sha256
          if grep -qx absent dist/trivy/trivy-java-db.sha256; then
            test ! -e .cache/trivy/java-db/trivy-java.db
          else
            sha256sum --check dist/trivy/trivy-java-db.sha256
          fi
      - name: Scan linux/arm64 image before publication
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: false
          scan-type: image
          image-ref: hermes-helmet:scan-arm64
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: json
          output: dist/trivy/derived-arm64.json
          exit-code: "0"
          cache-dir: ${{ github.workspace }}/.cache/trivy
          hide-progress: true
      - name: Verify unchanged Trivy database after linux/arm64 scans
        run: |
          sha256sum --check dist/trivy/trivy-db.sha256
          if grep -qx absent dist/trivy/trivy-java-db.sha256; then
            test ! -e .cache/trivy/java-db/trivy-java.db
          else
            sha256sum --check dist/trivy/trivy-java-db.sha256
          fi
      - name: Enforce clean linux/arm64 wrapper delta
        run: |
          python scripts/compare_trivy_reports.py \
            --base dist/trivy/base-arm64.json \
            --derived dist/trivy/derived-arm64.json \
            --platform linux/arm64 \
            --expected-base-ref "$HERMES_BASE_IMAGE" \
            --database-sha256-file dist/trivy/trivy-db.sha256 \
            --java-database-sha256-file dist/trivy/trivy-java-db.sha256 \
            --output dist/trivy/delta-arm64.json
      - name: Release linux/arm64 scan layers
        if: always()
        run: |
          rm -f dist/trivy/base-arm64.json dist/trivy/derived-arm64.json
          docker image rm -f hermes-helmet:scan-arm64 || true
          docker image rm -f hermes-base:scan-arm64 || true
          docker buildx prune --all --force || true
      - name: Upload sanitized image scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-security-evidence
          path: |
            dist/trivy/delta-*.json
            dist/trivy/trivy-db.sha256
            dist/trivy/trivy-db-metadata.json
            dist/trivy/trivy-java-db.sha256
            dist/trivy/trivy-java-db-metadata.json
          if-no-files-found: warn
      - name: Require private GHCR package before development-image publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(
            gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/hermes-helmet-oss" \
              --jq .visibility
          )"
          test "$visibility" = private
      - name: Log in to GHCR after security gates pass
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/amd64 and linux/arm64 image with attestations
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/machinewisdomai/hermes-helmet-oss:dev-${{ env.SOURCE_COMMIT }}
          build-args: |
            HERMES_HELMET_SOURCE_COMMIT=${{ env.SOURCE_COMMIT }}
            HERMES_HELMET_VERSION=0.1.0rc1
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
            org.opencontainers.image.source=https://github.com/MachineWisdomAI/hermes-helmet
            com.machinewisdom.hermes-helmet.source-commit=${{ env.SOURCE_COMMIT }}
          cache-from: |
            type=gha,scope=scan-amd64
            type=gha,scope=scan-arm64
          provenance: mode=max
          sbom: true
      - name: Smoke-test published development image
        run: scripts/smoke-dev-image.sh "ghcr.io/machinewisdomai/hermes-helmet-oss:dev-${SOURCE_COMMIT}"
      - name: Record image identity
        run: |
          mkdir -p dist
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          commit = os.environ["SOURCE_COMMIT"]
          payload = {
              "image_repository": "ghcr.io/machinewisdomai/hermes-helmet-oss",
              "image_tag": f"dev-{commit}",
              "image_ref": f"ghcr.io/machinewisdomai/hermes-helmet-oss:dev-{commit}",
              "image_digest": os.environ["IMAGE_DIGEST"],
              "platforms": ["linux/amd64", "linux/arm64"],
              "source_commit": commit,
              "version": "0.1.0rc1",
              "pushed": True,
          }
          Path("dist/image-identity.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat dist/image-identity.json
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
      - name: Upload image identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-identity
          path: dist/image-identity.json
      - name: Download packaged candidate artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-package
          path: dist/rc
      - name: Record private release evidence
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          cp dist/trivy/delta-amd64.json dist/rc/delta-amd64.json
          cp dist/trivy/delta-arm64.json dist/rc/delta-arm64.json
          PYTHONPATH=src python -m hermes_helmet.release_candidate write \
            --source-revision "$SOURCE_COMMIT" \
            --image-digest "$IMAGE_DIGEST" \
            --dist dist/rc \
            --out dist/rc/release-evidence.json
          cat dist/rc/release-evidence.json
      - name: Verify packaged checksums
        working-directory: dist/rc
        run: sha256sum --check SHA256SUMS
      - name: Upload private release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: |
            dist/rc/release-evidence.json
            dist/rc/SHA256SUMS
            dist/rc/CHANGELOG.md
            dist/rc/LICENSE
            dist/rc/NOTICE
            dist/rc/source-sbom.spdx.json
            dist/rc/provenance.json
            dist/rc/delta-amd64.json
            dist/rc/delta-arm64.json
          if-no-files-found: error
