[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-helmet"
version = "0.1.0rc1"
description = "Open-source software factory for coding agents: delegation, review, and repair"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Machine Wisdom AI" }]

[project.urls]
Homepage = "https://github.com/MachineWisdomAI/hermes-helmet"
Documentation = "https://github.com/MachineWisdomAI/hermes-helmet/blob/main/README.md"
Issues = "https://github.com/MachineWisdomAI/hermes-helmet/issues"

[project.scripts]
hermes-helmet-poller = "hermes_helmet.github_issue_poller:main"
hermes-helmet-install-poller = "hermes_helmet.install_poller:main"
hermes-helmet = "hermes_helmet.cli:main"
helmet = "hermes_helmet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
