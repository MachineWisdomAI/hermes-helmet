<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captain’s Bridge</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--ink:#0a2540;--muted:#62718b;--line:#e5e9f0;--violet:#6257d8;--violet-soft:#f3f1ff;--amber:#975800;--amber-soft:#fff7e8;--teal:#087f88;--green:#206d40;--green-soft:#eaf7ee;--rose:#9b4052;--rose-soft:#fff0f3;--slate-soft:#f3f5f8;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--color-background-primary,var(--bg));color:var(--color-text-primary,var(--ink))}
@media(prefers-color-scheme:dark){:root{--bg:#181b22;--ink:#edf0fa;--muted:#a6b1c9;--line:#343a47;--violet:#bbb4ff;--violet-soft:#2d2943;--amber:#ffd391;--amber-soft:#352b1d;--teal:#73d6db;--green:#96d7ab;--green-soft:#203629;--rose:#f1a3b2;--rose-soft:#3b252f;--slate-soft:#252a35}}
*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{color:inherit;cursor:pointer}button:disabled{cursor:wait;opacity:.6}a{color:var(--violet);text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--violet);outline-offset:4px}button,summary{-webkit-tap-highlight-color:transparent}button{border:0;background:none;text-align:left;padding:0}p{margin:8px 0 16px;max-width:68ch}h1{font-size:26px;line-height:1.25;letter-spacing:-.55px;margin:0 0 14px}h2{font-size:19px;line-height:1.4;letter-spacing:-.2px;margin:0 0 7px}h3{font-size:16px;line-height:1.4;margin:0}small,.small{font-size:12px;line-height:1.5}.muted{color:var(--muted)}.brand{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;font-size:12px}.brand strong{font-weight:600}.shell{max-width:900px;margin:auto;padding:28px 28px 18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.fresh{font-size:12px;color:var(--muted);text-align:right;max-width:190px}.button{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;padding:7px 13px;background:var(--bg)}.primary{background:var(--violet-soft);border-color:transparent;color:var(--violet);font-weight:600}.link{color:var(--violet);font-size:14px}.lead{font-size:16px;font-weight:600;line-height:1.6}.context{color:var(--muted)}section{margin:26px 0;padding-top:24px;border-top:1px solid var(--line)}section>p{color:var(--muted);font-size:14px}.work-list{margin-top:14px}.work-row{width:100%;display:block;padding:15px 0;border-top:1px solid var(--line);border-radius:0;position:relative}.work-row:hover{background:var(--slate-soft)}.work-row.selected{background:var(--violet-soft);padding:15px 14px;border:1px solid var(--line);border-radius:6px}.work-row.unresolved{background:var(--amber-soft);padding:15px 14px;margin:10px 0;border:0;border-radius:6px}.row-title{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-weight:600}.row-summary{display:block;color:var(--muted);font-size:14px;margin-top:5px;padding-right:25px}.badge{display:inline-block;font-size:12px;font-weight:500;line-height:1.4;padding:3px 9px;border-radius:20px;background:var(--slate-soft);color:var(--muted)}.badge.changed{color:var(--violet);background:var(--violet-soft)}.badge.merged{color:var(--green);background:var(--green-soft)}.badge.unresolved{color:var(--amber);background:var(--amber-soft)}.breadcrumb{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:0 0 25px;color:var(--muted);font-size:12px}.breadcrumb span{overflow-wrap:anywhere}.status-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 26px}.status{padding:15px 17px;border-radius:7px;background:var(--violet-soft)}.status.reported{background:var(--rose-soft)}.status strong{display:block;line-height:1.4}.status small{color:var(--muted)}.steps{list-style:none;padding:0;margin:24px 0}.step{padding:0 0 20px 17px;border-left:2px solid var(--line)}.step:last-child{padding-bottom:0}.actor{font-size:14px;font-weight:600;color:var(--violet)}.actor.hermes{color:var(--teal)}.actor.captain{color:var(--amber)}.step p{font-size:14px;margin:3px 0 4px;color:var(--muted)}.step button{font-size:12px}.source-action{display:block;width:100%;padding:15px 17px;background:var(--violet-soft);border-radius:6px;color:var(--violet);margin:15px 0}.source-action small{display:block;font-weight:400;color:var(--muted)}.external{display:block;padding:12px 0;font-size:14px;border-bottom:1px solid var(--line)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:26px 0}.value{background:var(--slate-soft);padding:25px 18px;border-radius:8px;text-align:center;overflow-wrap:anywhere}.value.after{background:var(--violet-soft);color:var(--violet)}.value strong{display:block;font-size:clamp(24px,6vw,50px);letter-spacing:-1px;line-height:1.2;margin-bottom:10px}.value small{color:var(--muted)}.timeline{margin:16px 0}.time-row{padding:7px 0 7px 16px;border-left:2px solid var(--line);font-size:14px}.time-row strong{font-size:13px}.gap{font-size:12px;color:var(--muted);padding:15px 0 15px 16px}.duration{float:right;color:var(--muted)}.notice{background:var(--amber-soft);padding:12px 16px;border-radius:6px;margin-bottom:22px;font-size:14px}.notice button{display:block;margin-top:5px}.empty{padding:30px 0}.error{color:var(--rose);background:var(--rose-soft);padding:12px 16px;border-radius:6px;margin:12px 0}.record{padding:20px 0;border-bottom:1px solid var(--line)}.record pre{font:13px/1.6 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.record .record-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.record header{display:flex;gap:12px;align-items:baseline}.report-excerpt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;color:var(--muted)}details{font-size:13px;color:var(--muted);margin:20px 0}summary{cursor:pointer}footer{border-top:1px solid var(--line);padding-top:15px;margin-top:30px;display:flex;justify-content:space-between;gap:15px;font-size:11px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:480px){.shell{padding:22px 19px}.brand{padding:12px 19px}.top{flex-wrap:wrap}.fresh{text-align:left;max-width:none}h1{font-size:24px}.status-pair{gap:8px}.status{padding:13px}.compare{gap:12px}.duration{float:none;display:block}}@media(prefers-reduced-motion:no-preference){button,a{transition:background-color .12s}}
.chat-actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}.action-context{font-size:12px;color:var(--muted);margin:0 0 16px}.request-status{font-size:13px;color:var(--muted);padding:10px 0 18px}
</style></head><body>
<div class="brand"><span>Hermes Helmet</span><strong>Captain’s Bridge</strong></div>
<div class="shell"><div id="error" class="error" role="alert" hidden></div><div id="request-status" class="request-status" role="status" hidden></div><main id="app" aria-live="polite"><div class="empty"><h1>Work in this chat</h1><p class="context" id="connection">Connecting to Codex…</p><button class="button primary" id="connect" disabled>Open this chat’s walkthrough</button></div></main><footer><span>Machine Wisdom AI</span><span>Read on demand</span></footer></div>
<script>
'use strict';
const $=id=>document.getElementById(id);let deck=null,portableView=null,view={page:'overview'},stack=[],selected=null,host=false,requestId=10;const pending=new Map();let loadVersion=0;
let messagePending=false,trigger=null,seq=0;
function el(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}
function append(parent,...children){children.filter(Boolean).forEach(c=>parent.append(c));return parent}
function button(text,fn,cls='link'){const b=el('button',text,cls);b.type='button';b.id='ctl-'+(seq++);b.onclick=(...a)=>{trigger=b.id;return fn(...a)};return b}
function readable(t){return String(t||'').replace(/\[([^\]]+)\]\((?:plugin:\/\/|\/Users\/)[^)]+\)/g,'$1').replace(/\[([^\]]+)\]\((https:\/\/[^)]+)\)/g,'$1').replace(/^#{1,6}\s+/gm,'').replace(/\*\*([^*]+)\*\*/g,'$1')}
function date(t){if(t==null)return 'Time unavailable';const n=typeof t==='number'?(t>1e12?t:t*1000):Date.parse(t);return Number.isFinite(n)?new Date(n).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Time unavailable'}
function seconds(t){if(t==null)return null;return typeof t==='number'?(t>1e12?t/1000:t):Date.parse(t)/1000}
function duration(ms){if(ms==null)return 'No end recorded';const s=Math.max(0,Math.round(ms/1000));return s<60?s+' sec':s<3600?Math.round(s/60)+' min':Math.floor(s/3600)+' hr '+Math.round(s%3600/60)+' min'}
function send(message){parent.postMessage({jsonrpc:'2.0',...message},'*')}
function rpc(method,params){return new Promise((resolve,reject)=>{const id=++requestId;const timer=setTimeout(()=>{pending.delete(id);reject(Error('The connection timed out. Your current view is preserved.'))},45000);pending.set(id,{resolve,reject,timer});send({id,method,params})})}
function error(message){$('error').hidden=!message;$('error').textContent=message||''}
function navigate(next){stack.push({...view,scroll:window.scrollY,focus:trigger||document.activeElement?.id});trigger=null;view=next;render();window.scrollTo(0,0)}
function back(){view=stack.pop()||{page:'overview'};render();requestAnimationFrame(()=>{window.scrollTo(0,view.scroll||0);if(view.focus)$(view.focus)?.focus({preventScroll:true})})}
function source(refs,title='Supporting records'){navigate({page:'sources',refs,title})}
function item(){return deck.walkthrough?.items.find(i=>i.id===view.id)}
function allRecords(){return [...(deck.records||[]),...(deck.previousRecords||[])]}
function evidenceButton(refs,label='Read supporting records'){return button(label,()=>source(refs), 'source-action')}
function heading(text,sub){const s=el('section');append(s,el('h2',text),sub?el('p',sub):null);return s}
function crumb(title){return append(el('div',null,'breadcrumb'),el('span',(deck.title||'This chat')+(title?' / '+title:'')),button('Back to changes',back))}
function skillPrompt(skill,workItem){
 const threadId=deck?.threadId||portableView?.threadId;
 if(!threadId)throw Error('This view has no chat reference. Open its walkthrough before requesting a skill.');
 const scope='Originating chat: codex://threads/'+threadId+'. Verify that CODEX_THREAD_ID matches this chat before proceeding; if it differs, report the mismatch and stop.';
 const discovery='Read the installed skill before applying it. If it is not installed or unavailable, report that clearly and stop; do not silently substitute another skill.';
 if(skill==='retro')return 'Use the installed $retro skill for a retrospective of this coding session. Present suggestions for improving future runs, grounded in the session’s sources. Do not apply the suggestions or resume the underlying project work.\n\n'+scope+'\n'+discovery;
 const reference=workItem?{title:workItem.title,summary:workItem.summary}:{objective:deck.walkthrough?.objective};
 return 'Use the installed $show-me skill to create a visual explanation of '+(workItem?'the selected work below.':'the substantive work in this chat, excluding viewer setup and navigation.')+' Show the result inside Codex and keep generated artifacts outside tracked project files. This is an explanation request; do not implement changes or resume the underlying project work.\n\n'+scope+'\n'+discovery+'\n\nReference material from the walkthrough; verify it against the original source records:\n'+JSON.stringify(reference);
}
async function requestSkill(skill,workItem,b){
 if(messagePending)return;
 const status=$('request-status'),label=skill==='retro'?'Retro':'Show Me';
 try{
  const text=skillPrompt(skill,workItem);messagePending=true;if(b)b.disabled=true;error('');status.hidden=false;status.textContent='Requesting '+label+' in this chat…';
  const result=await rpc('ui/message',{role:'user',content:[{type:'text',text}]});
  if(result?.isError)throw Error(result.content?.find(c=>c.type==='text')?.text||'The request could not be sent.');
  status.textContent=label+' requested in this chat. The first officer will respond in the conversation.';
 }catch(e){status.hidden=true;error(e.message)}finally{messagePending=false;if(b)b.disabled=false}
}
function skillButton(skill,workItem){const b=button(skill==='retro'?'Retro':'Show Me',()=>requestSkill(skill,workItem,b),'button');b.title=skill==='retro'?'Suggest improvements for future sessions':'Ask for a visual explanation';b.disabled=messagePending;return b}
function chatActions(main){append(main,append(el('div',null,'chat-actions'),skillButton('show-me'),skillButton('retro')),el('p','Visual explanation or session retrospective. The first officer responds in this chat.','action-context'))}
async function explain(){try{await rpc('ui/message',{role:'user',content:[{type:'text',text:'Open Captain’s Bridge for this current chat with an updated source-grounded walkthrough. Use the observe-chat skill, read_chat_work, and present_chat_work. Preserve current-chat scope. Do not start or resume the underlying project work.'}]});error('');const n=el('p','Requested an updated walkthrough in this chat.','context');$('app').prepend(n)}catch(e){error(e.message)}}
async function refresh(b){b.disabled=true;error('');try{receive(await rpc('tools/call',{name:'refresh_observation_deck',arguments:{view:portableView}}))}catch(e){error(e.message)}finally{b.disabled=false}}
function timeline(limit){const wrap=el('div',null,'timeline');let previous=null;const turns=deck.turns||[];for(const [index,t]of turns.slice(0,limit||turns.length).entries()){const start=seconds(t.startedAt),end=seconds(t.completedAt);if(previous!=null&&start!=null&&start-previous>60)append(wrap,el('div','Gap between recorded turns · '+duration((start-previous)*1000),'gap'));const row=el('div',null,'time-row');append(row,el('strong',date(t.startedAt)),el('span',duration(t.durationMs),'duration'));const request=readable(t.request).split('\n').find(x=>x.trim())||'Recorded turn';append(row,el('div',request.slice(0,180),'muted'));if(view.page==='activity')append(row,button('Read this turn',()=>source(allRecords().filter(r=>r.turnId===t.id).map(r=>r.id),'Recorded turn')));append(wrap,row);previous=end;}return wrap}
function overview(main){const account=deck.walkthrough;const title=el('div');append(title,el('h1',deck.title||'This chat'));const fresh=el('div',null,'fresh');const refreshButton=button('Refresh',()=>refresh(refreshButton),'button');append(fresh,refreshButton,el('div','Records read '+date(deck.readAt)));append(main,append(el('div',null,'top'),title,fresh));
 if(!account){append(main,el('p','Read the work before you steer it.','lead'),el('p','The chat’s records are connected. Ask the first officer to organize its changes, handoffs and unresolved work into a walkthrough.','context'),button('Prepare walkthrough',explain,'button primary'));const s=heading('Recorded activity','You can inspect the source records while the explanation is prepared.');append(s,timeline(3),button('View full activity',()=>navigate({page:'activity'})));append(main,s);return;}
 append(main,el('p',account.summary,'lead'),el('p',account.objective,'context'));chatActions(main);append(main,button('Sources for this overview',()=>source(account.evidence),'link small'));
 const groups=[['changed','What changed','Changes described in the supporting records.'],['unresolved','What remains unresolved','Open work and disagreements that still matter.'],['activity','Other recorded work','Activity that has not established a delivered change.']];
 for(const [group,title,subtitle] of groups){const items=account.items.filter(i=>i.group===group);if(!items.length)continue;const s=heading(title,subtitle);const list=el('div',null,'work-list');for(const i of items){const row=button('',()=>{selected=i.id;navigate({page:'work',id:i.id})},'work-row'+(group==='unresolved'?' unresolved':'')+(selected===i.id?' selected':''));row.id='work-'+i.id;const badgeClass=/^merged$/i.test(i.status)?'merged':group;append(row,append(el('div',null,'row-title'),el('span',i.title),el('span',i.status,'badge '+badgeClass)),el('span',i.summary,'row-summary'));append(list,row)}append(s,list);append(main,s)}
 const time=el('details');time.open=!!view.timeOpen;time.ontoggle=()=>{view.timeOpen=time.open};append(time,el('summary','Elapsed time and gaps'),el('p','Turn durations are recorded intervals, not proof of continuous execution. Gaps are not stalls.'),timeline(2),button('View full activity',()=>navigate({page:'activity'})));append(main,time);
}
function work(main,i){append(main,crumb(i.title),append(el('div',null,'row-title'),el('h1',i.title),el('span',i.status,'badge '+i.group)),el('p',i.summary,'context'));
 if(i.reported||i.disposition){const pair=el('div',null,'status-pair');for(const [key,cls]of[['reported','reported'],['disposition','']]){const v=i[key];if(!v)continue;const b=button('',()=>source(v.evidence),'status '+cls);append(b,el('strong',v.label),el('small','by '+v.actor));append(pair,b)}append(main,pair)}
 append(main,el('h2',i.group==='unresolved'?'Why this is still open':'What happened'),el('p',i.detail,'context'));
 append(main,append(el('div',null,'chat-actions'),skillButton('show-me',i)),el('p','Ask the first officer to visually explain this work.','action-context'));
 if(i.change){const b=button('View before and after',()=>navigate({page:'change',id:i.id}),'source-action');append(b,el('small',i.change.before+' → '+i.change.after));append(main,b)}
 if(i.steps.length){const list=el('ol',null,'steps');for(const s of i.steps){const row=el('li',null,'step');append(row,el('div',s.actor,'actor '+s.actor.toLowerCase().split(' ')[0]),el('strong',s.label),el('p',s.detail),button('Source',()=>source(s.evidence,s.label)));append(list,row)}append(main,list)}
 if(i.relations?.length){append(main,el('h2','Related handoffs and wakeups'),el('p','These relationships are explicitly recorded in the chat. Their order on screen does not by itself show that one caused another, and a quiet period is not a stall.','action-context'));const rl=el('ul',null,'steps');for(const r of i.relations){const row=el('li',null,'step');append(row,el('div',r.kind,'actor'),el('strong',r.label),el('p',r.detail),button('Source',()=>source(r.evidence,r.label)));append(rl,row)}append(main,rl)}
 append(main,evidenceButton(i.evidence));for(const l of i.links){const a=el('a',l.label,'external');a.href=l.url;a.target='_blank';a.rel='noopener noreferrer';append(main,a)}
}
function change(main,i){const c=i.change;if(!c){view={page:'work',id:i.id};render();return}append(main,crumb(i.title),el('h1',i.title),el('p',i.summary,'context'));const compare=el('div',null,'compare');for(const [label,value,cls]of[['Before',c.before,''],['After',c.after,'after']])append(compare,append(el('div',null,'value '+cls),el('strong',value),el('small',label)));append(main,compare,el('h2','What changed'),el('p',c.explanation,'context'),evidenceButton(c.evidence,'View recorded change'),button('Return to this work',back));}
function sources(main){append(main,crumb('Supporting records'),el('h1',view.title||'Supporting records'));const wanted=new Set(view.refs||[]),records=allRecords().filter(r=>wanted.has(r.id));if(!records.length)append(main,el('p','These source records are no longer available in this connection. Refresh or reopen the walkthrough.','context'));for(const r of records){const section=el('article',null,'record');append(section,append(el('header'),el('strong',r.actor||'Recorded source'),el('span',r.kind,'badge')));const t=deck.turns.find(t=>t.id===r.turnId);if(t)append(section,el('small','Within turn starting '+date(t.startedAt),'muted'));for(const url of [...new Set(String(r.text).match(/https:\/\/[^\s<>"')\]]+/g)||[])].slice(0,5)){const a=el('a','Open original: '+url,'external');a.href=url;a.target='_blank';a.rel='noopener noreferrer';append(section,a)}
 append(section,el(['command','tool','change'].includes(r.kind)?'pre':'div',r.text,['command','tool','change'].includes(r.kind)?'':'record-text'));if(r.truncated)append(section,el('p','This excerpt was shortened. Open the original chat for the complete record.','small muted'));append(main,section)}}
function render(){if(!deck)return;seq=0;const main=$('app');main.replaceChildren();if(deck.explanationStale){const n=el('div',null,'notice');append(n,el('span','Records changed since this walkthrough was prepared. Its conclusions may need updating.'),button('Update walkthrough',explain));append(main,n)}
 if(view.page==='overview')overview(main);else if(view.page==='sources')sources(main);else if(view.page==='activity'){append(main,crumb('Activity'),el('h1','Recorded activity'),el('p','The gaps below are gaps between stored turns. They do not establish a stall.','context'),timeline());}else{const i=item();if(i)view.page==='change'?change(main,i):work(main,i);else{view={page:'overview'};overview(main)}}
 const d=el('details');append(d,el('summary','About these records'),el('p','The walkthrough is the first officer’s interpretation, with links to its supporting records. A report of completion and acceptance of the work are separate claims.'));append(d,el('p',deck.coverage||'Existing records from this chat.'));if(deck.walkthrough)append(d,el('p','Explanation prepared from records read '+date(deck.walkthrough.explainedAt)));append(main,d)}
function showConnection(message){if($('connection'))$('connection').textContent=message}
async function loadPrepared(reference){const version=++loadVersion;showConnection('Loading this chat’s prepared walkthrough…');try{const result=toolResult(await rpc('tools/call',{name:'get_chat_work_view',arguments:{view:reference}}));if(version!==loadVersion)return;if(result?.isError)throw Error(result.content?.find(c=>c.type==='text')?.text||'The walkthrough could not be loaded.');if(!result?._meta?.deck&&!result?.structuredContent?.deck)throw Error('Codex returned no walkthrough data. The previous view is preserved.');receive(result)}catch(e){if(version===loadVersion){error(e.message);showConnection('The walkthrough could not be loaded.')}}}
// Codex saved tool events may wrap a complete MCP result in a single JSON text block.
// Unwrap only that result shape; prose and source-record JSON remain literal content.
function toolResult(result){for(let depth=0;depth<2;depth++){if(result?.isError||result?.structuredContent||result?._meta?.deck)return result;const blocks=result?.content;if(!Array.isArray(blocks)||blocks.length!==1||blocks[0]?.type!=='text')return result;let nested;try{nested=JSON.parse(blocks[0].text)}catch{return result}if(!nested||typeof nested!=='object'||!Array.isArray(nested.content)||!('structuredContent'in nested||'_meta'in nested||'isError'in nested))return result;result=nested}return result}
function receive(raw){const result=toolResult(raw);if(result?.isError){error(result.content?.find(c=>c.type==='text')?.text||'The records could not be read.');return}const data=result?.structuredContent||{},payload=result?._meta?.deck?result._meta:data;if(payload.deck){++loadVersion;deck=payload.deck;portableView=payload.view;error('');render()}else if(data.needsBinding){showConnection('Ask the first officer to connect this view to the current chat.')}else if(data.view){return loadPrepared(data.view)}else{error('The panel received a result without walkthrough data. Its explanation has not opened.');showConnection('No walkthrough data received.')}}
$('connect').onclick=explain;
addEventListener('message',e=>{if(e.source!==parent)return;const m=e.data;if(m?.id===1&&m.result){host=true;send({method:'ui/notifications/initialized',params:{}});$('connect')&&($('connect').disabled=false);if($('connection'))$('connection').textContent='Connected to Codex. Waiting for this chat’s records.';for(const[k,v]of Object.entries(m.result.hostContext?.styles?.variables||{}))if(k.startsWith('--'))document.documentElement.style.setProperty(k,v)}else if(pending.has(m?.id)){const p=pending.get(m.id);clearTimeout(p.timer);pending.delete(m.id);m.error?p.reject(Error(m.error.message)):p.resolve(m.result)}else if(m?.method==='ui/notifications/tool-result')receive(m.params);else if(m?.method==='ping'||m?.method==='ui/resource-teardown')send({id:m.id,result:{}})});
if(parent!==window)send({id:1,method:'ui/initialize',params:{protocolVersion:'2026-01-26',appInfo:{name:'hermes-helmet-captains-bridge',version:'1'},appCapabilities:{availableDisplayModes:['fullscreen']}}});else $('connection').textContent='Open Captain’s Bridge through the plugin in Codex.';
</script></body></html>
